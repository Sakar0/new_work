<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffd9e8">
<title>My Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@600;700&family=Rubik+Bubbles&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow-x:hidden;color:#673c67;font-family:"Baloo 2",sans-serif;background:radial-gradient(ellipse at 12% 10%,#fff1f6,transparent 36%),radial-gradient(ellipse at 88% 28%,#ffc4dd,transparent 38%),linear-gradient(145deg,#ffdbe9,#fff0e6 58%,#ffd5e5)}
.bg-sparkles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg-sparkles span{position:absolute;left:var(--x);top:var(--y);font-size:var(--size);opacity:var(--opacity);animation:floaty var(--speed) ease-in-out var(--delay) infinite alternate;filter:drop-shadow(0 3px 4px #bb679444)}
@keyframes floaty{to{transform:translate(var(--drift),-24px) rotate(8deg)}}
main{position:relative;z-index:1;width:min(1000px,calc(100% - 28px));margin:auto;padding:22px 0 38px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#986d91}
.top a{color:#875a86;text-decoration:none;border-bottom:2px dotted #d48db2}
.hero{text-align:center;padding:38px 12px 28px}
.kicker{display:inline-block;padding:7px 15px;border-radius:999px;background:#fff9;font-size:12px;letter-spacing:.16em;color:#985983}
h1{margin:14px 0 0;font:clamp(56px,13vw,112px)/.92 "Rubik Bubbles",sans-serif;color:#914b80;text-shadow:0 7px 0 #fff8,0 13px 24px #a8477522;transform:rotate(-2deg)}
.hero p{margin:14px 0 0;font:clamp(23px,5vw,34px) Caveat,cursive;color:#995d87}
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;align-items:center;margin:10px auto 42px}
.gallery-shot{position:relative;margin:0;padding:8px;background:rgba(255,255,255,.84);border-radius:43% 57% 52% 48% / 45% 39% 61% 55%;box-shadow:0 12px 28px #9c5d872d;animation:photoWiggle var(--float,4s) ease-in-out infinite alternate}
.gallery-shot:nth-child(4n+1){grid-row:span 2;transform:translateY(12px)}
.gallery-shot:nth-child(4n+2){border-radius:38% 62% 40% 60% / 55% 43% 57% 45%;transform:translateY(-8px)}
.gallery-shot:nth-child(4n+3){border-radius:58% 42% 61% 39% / 39% 57% 43% 61%;transform:translateY(20px)}
.gallery-shot:nth-child(4n){transform:translateY(-17px)}
.gallery-shot img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:inherit}
.gallery-shot:nth-child(4n+1) img{aspect-ratio:3/4}
.gallery-shot figcaption{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);padding:4px 11px;background:#fffE;border-radius:999px;white-space:nowrap;color:#814b76;font:700 12px "Baloo 2",sans-serif}
@keyframes photoWiggle{to{translate:0 -9px}}
.end-note{position:relative;text-align:center;margin:40px auto 10px;padding:36px 14px 22px;font:clamp(36px,8vw,68px)/1.05 "Rubik Bubbles",sans-serif;color:#8e4778;text-shadow:0 4px 0 #fff9}
.end-note span{display:block;margin-top:12px;font:clamp(27px,6vw,42px) Caveat,cursive;color:#a45380}
.end-sparkle{font-size:.52em;color:#dc76aa}
@media(max-width:700px){main{width:calc(100% - 20px)}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}.gallery-shot:nth-child(4n+1){grid-row:span 1}.top{font-size:10px}.hero{padding:30px 4px 22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
.gallery{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;align-items:stretch;margin:8px auto 24px}.gallery-shot,.gallery-shot:nth-child(4n+1),.gallery-shot:nth-child(4n+2),.gallery-shot:nth-child(4n+3),.gallery-shot:nth-child(4n){width:100%;aspect-ratio:1;margin:0;padding:5px;grid-row:auto;transform:none;border-radius:21px;background:rgba(255,255,255,.86);box-shadow:0 5px 13px #9c5d8720;animation:none}.gallery-shot img,.gallery-shot:nth-child(4n+1) img{width:100%;height:100%;aspect-ratio:1;object-fit:cover;border-radius:16px}.gallery-shot figcaption{display:none}.emoji-shot{display:grid;place-items:center;font-size:clamp(31px,4vw,42px);line-height:1}.gallery-shot:hover{transform:scale(1.04)!important;box-shadow:0 9px 18px #9c5d8740}@media(max-width:700px){.gallery{grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:7px;margin-bottom:18px}.gallery-shot,.gallery-shot:nth-child(4n+1),.gallery-shot:nth-child(4n+2),.gallery-shot:nth-child(4n+3),.gallery-shot:nth-child(4n){width:100%;aspect-ratio:1}}.gallery{grid-template-columns:repeat(auto-fill,56px);justify-content:center;gap:6px;margin:12px auto 24px}.gallery-shot,.gallery-shot:nth-child(4n+1),.gallery-shot:nth-child(4n+2),.gallery-shot:nth-child(4n+3),.gallery-shot:nth-child(4n){width:56px;height:56px;min-width:56px;max-width:56px;padding:3px;border-radius:13px}.gallery-shot img,.gallery-shot:nth-child(4n+1) img{width:100%;height:100%;aspect-ratio:1}.emoji-shot{font-size:31px}.end-note{display:block;margin:28px auto 10px;padding:20px 8px;text-align:center;font:clamp(30px,7vw,52px)/1.08 "Rubik Bubbles",sans-serif;color:#8e4778;text-shadow:0 4px 0 #fff9}main{padding-top:12px}@media(max-width:700px){.gallery{grid-template-columns:repeat(auto-fill,52px);gap:5px}.gallery-shot,.gallery-shot:nth-child(4n+1),.gallery-shot:nth-child(4n+2),.gallery-shot:nth-child(4n+3),.gallery-shot:nth-child(4n){width:52px;height:52px;min-width:52px;max-width:52px}.emoji-shot{font-size:29px}}.gallery{gap:3px;grid-template-columns:repeat(auto-fill,52px);justify-content:center}.gallery-shot,.gallery-shot:nth-child(4n+1),.gallery-shot:nth-child(4n+2),.gallery-shot:nth-child(4n+3),.gallery-shot:nth-child(4n){width:52px;height:52px;min-width:52px;max-width:52px;padding:0;border:0;background:transparent!important;box-shadow:none!important;border-radius:50%;animation:galleryDrift var(--float,14s) ease-in-out var(--delay,0s) infinite alternate;will-change:translate}.gallery-shot img,.gallery-shot:nth-child(4n+1) img{width:52px;height:52px;aspect-ratio:1;object-fit:cover;border-radius:50%;border:1px solid rgba(255,255,255,.68)}.emoji-shot{display:grid;place-items:center;font-size:34px;line-height:1}.gallery-shot:hover{transform:none!important}@keyframes galleryDrift{0%{translate:0 0}50%{translate:var(--drift,5px) -8px}100%{translate:calc(var(--drift,5px)*-1) 5px}}.end-note{margin-top:34px;padding:24px 8px 10px}@media(max-width:700px){.gallery{grid-template-columns:repeat(auto-fill,52px);gap:3px}.gallery-shot,.gallery-shot:nth-child(4n+1),.gallery-shot:nth-child(4n+2),.gallery-shot:nth-child(4n+3),.gallery-shot:nth-child(4n),.gallery-shot img,.gallery-shot:nth-child(4n+1) img{width:52px;height:52px;min-width:52px;max-width:52px}}.gallery{margin-bottom:0!important;padding-bottom:12px}.end-note{display:block;width:100%;margin:0 auto!important;padding:30px 12px 14px!important;text-align:center;font:clamp(38px,8vw,68px)/1.05 "Rubik Bubbles",sans-serif!important;color:#8e4778;text-shadow:0 4px 0 #fff9}@media(max-width:600px){.end-note{font-size:clamp(36px,9vw,52px)!important;padding-top:26px!important}}.kanxi-note{position:relative;z-index:1;margin:12px auto 0;padding:18px 8px 42px;text-align:center;color:#8e4778;font:clamp(48px,11vw,88px)/.98 "Rubik Bubbles",sans-serif;text-shadow:0 5px 0 rgba(255,255,255,.72),0 10px 22px rgba(151,67,118,.18)}@media(max-width:600px){.kanxi-note{font-size:clamp(42px,12vw,64px);padding-bottom:34px}}body .music{position:fixed;right:14px;bottom:14px;z-index:20!important;width:48px;height:48px;border:2px solid rgba(255,255,255,.95);border-radius:50%;background:linear-gradient(145deg,#fff9fd,#ffddeb);color:#603d68;box-shadow:0 7px 18px rgba(98,57,92,.22);cursor:pointer;font-size:0!important;display:grid;place-items:center}body .music:before{content:"♫";font:700 24px "Baloo 2",sans-serif;color:#603d68}body .music.music-on{animation:musicGlow 2.5s ease-in-out infinite alternate}@keyframes musicGlow{to{box-shadow:0 0 0 7px rgba(231,145,186,.17),0 8px 22px rgba(98,57,92,.28);transform:scale(1.04)}}</style>
</head>
<body>

<main>


<section class="gallery" id="gallery" aria-label="A gallery of favourite photos"></section>

<footer class="end-note">Here is Lilly, my love.</footer><div class="kanxi-note">Love you Kanxi</div></main>
<script>
(()=>{const items=[],photos=['212F8DC3-B20C-4084-894B-E425CC5BFCEE.jpeg','7CACF4FA-3227-419F-95DC-2C3979EC1ABC.jpeg','D368113B-76CC-4962-B9AE-02A057E5D724.jpeg'];for(let i=0;i<72;i++)items.push({photo:photos[i%photos.length]});const icons=['🍒','🌈','🌸','🌷','🎸','🌺','🍒','🌈','🪷','🎸','🍒','🌼'];for(let i=0;i<72;i++)items.push({icon:icons[i%icons.length]});items.sort(()=>Math.random()-.5);const gallery=document.getElementById('gallery');items.forEach(item=>{const tile=document.createElement('figure');tile.className='gallery-shot';tile.style.setProperty('--float',(12+Math.random()*9)+'s');tile.style.setProperty('--delay',(-Math.random()*16)+'s');tile.style.setProperty('--drift',(Math.random()*16-8)+'px');if(item.photo){const img=document.createElement('img');img.src=item.photo;img.alt='A favourite photo together';tile.appendChild(img)}else{tile.classList.add('emoji-shot');tile.textContent=item.icon;tile.setAttribute('aria-label','Favourite decoration '+item.icon)}gallery.appendChild(tile)})})();
</script>
<audio id="romanticAudio" src="romantic-loop.wav" loop preload="none"></audio>
<script>
(()=>{const audio=document.getElementById('romanticAudio');audio.volume=.42;let button=document.getElementById('music');if(!button){button=document.createElement('button');button.id='music';button.className='music';button.type='button';button.setAttribute('aria-label','Toggle romantic background music');document.body.appendChild(button)}button.textContent='♫';button.title='Play or pause the romantic music';button.setAttribute('aria-pressed','false');button.onclick=async()=>{if(audio.paused){try{await audio.play();button.classList.add('music-on');button.setAttribute('aria-pressed','true')}catch(e){button.classList.remove('music-on');button.setAttribute('aria-pressed','false')}}else{audio.pause();button.classList.remove('music-on');button.setAttribute('aria-pressed','false')}};audio.addEventListener('ended',()=>{button.classList.remove('music-on');button.setAttribute('aria-pressed','false')})})();
</script></body>
</html>
