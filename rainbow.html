e me smile</h2></div><p class="note">even on mondays.</p></article><div class="side"><article class="card reveal"><span class="small">REMINDER</span><div class="rule"></div><p class="short-note">you are pretty great, btw.</p></article><article class="card reveal"><span class="small">CHERRY BREAK</span><div class="rule"></div><p>tap anywhere. see what happens.</p></article></div></section><div class="playful"><button class="surprise" type="button">tap for a surprise</button><span class="surprise-note" aria-live="polite"></span></div></main><footer class="footer"><span>Made with love</span><span>KEEP THIS SKY</span></footer></div><script>
(()=>{const garden=document.getElementById('garden'),small=matchMedia('(max-width:600px)').matches;for(let i=0;i<(small?28:44);i++){const e=document.createElement('span'),flower=i%3===0;e.className=flower?'lily':'fruit';e.textContent=flower?(i%2?'\u273F':'\u2740'):'\uD83C\uDF52';const edge=i%4;e.style.left=edge===0?(Math.random()*14)+'%':edge===1?(84+Math.random()*14)+'%':(Math.random()*100)+'%';e.style.top=(Math.random()*100)+'%';e.style.setProperty('--size',(flower?16:14)+Math.random()*(flower?18:14)+'px');e.style.setProperty('--op',flower?'.34':'.43');e.style.setProperty('--speed',(4+Math.random()*6)+'s');e.style.setProperty('--petal',i%2?'#f6dce7':'#fff0dc');e.style.animationDelay=(-Math.random()*7)+'s';garden.appendChild(e)}document.body.classList.add('ready');document.querySelectorAll('.page-link').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.body.classList.add('leaving');setTimeout(()=>location.href=a.href,280)}));const btn=document.querySelector('.surprise'),note=document.querySelector('.surprise-note');const quips=document.body.classList.contains('sky')?['boop! cherry delivery.','you are my blue-sky person.','one tiny kiss for you.']:document.body.classList.contains('peach')?['smooch!','you are my favourite cutie.','date soon? please say yes.']:['sparkle attack!','you are a whole delight.','one hug, coming up.'];let qi=0;btn.addEventListener('click',()=>{note.textContent=quips[qi++%quips.length];note.classList.remove('pop-note');void note.offsetWidth;note.classList.add('pop-note')});document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{c.classList.add('boop');setTimeout(()=>c.classList.remove('boop'),500)}));document.addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;const p=document.createElement('span');p.textContent=Math.random()<.5?'\uD83C\uDF52':'\u273F';p.style.cssText='position:fixed;z-index:4;left:'+e.clientX+'px;top:'+e.clientY+'px;color:#e79baa;font-size:24px;pointer-events:none;animation:arrive .6s reverse forwards';document.body.appendChild(p);setTimeout(()=>p.remove(),650)})})();
